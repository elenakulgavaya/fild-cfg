[metadata]
name = fild-cfg
version = 0.0.2
author = Elena Kulgavaya
author_email = elena.kulgavaya@gmail.com
description = [DEPRECATED] Use surety-config instead. Configure fild tools with yaml files
long_description = file: README.md, CHANGELOG.rst, LICENSE.rst
long_description_content_type = text/markdown
url = https://github.com/elenakulgavaya/fild-cfg
project_urls =
    Bug Tracker = https://github.com/elenakulgavaya/fild-cfg/issues
classifiers =
    Development Status :: 7 - Inactive
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages =
    fild_cfg
python_requires = >=3.9
install_requires =
    fild>=0.0.8
    pyyaml
